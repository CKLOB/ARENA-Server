spring:
  application:
    name: arena

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    # Base64-encoded secret with at least 32 bytes before encoding.
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:PT15M}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:P14D}
    onboarding-token-expiration: ${JWT_ONBOARDING_TOKEN_EXPIRATION:PT10M}

oauth:
  google:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    redirect-uris:
      web: ${GOOGLE_OAUTH_REDIRECT_URI_WEB:}
      ios: ${GOOGLE_OAUTH_REDIRECT_URI_IOS:}
      android: ${GOOGLE_OAUTH_REDIRECT_URI_ANDROID:}
  kakao:
    client-id: ${KAKAO_OAUTH_CLIENT_ID:}
    client-secret: ${KAKAO_OAUTH_CLIENT_SECRET:}
    redirect-uris:
      web: ${KAKAO_OAUTH_REDIRECT_URI_WEB:}
  apple:
    ios-client-id: ${APPLE_OAUTH_IOS_CLIENT_ID:}
    android-client-id: ${APPLE_OAUTH_ANDROID_CLIENT_ID:}
    team-id: ${APPLE_TEAM_ID:}
    key-id: ${APPLE_KEY_ID:}
    private-key: ${APPLE_PRIVATE_KEY:}
    android-redirect-uri: ${APPLE_OAUTH_ANDROID_REDIRECT_URI:}

market:
  active-markets: US,COIN
  quote-ttl:
    US: PT1M
    COIN: PT15S
  history-ttl: PT15M
  history-max-days: 7
  symbol-sync-max-deactivation-ratio: ${MARKET_SYMBOL_SYNC_MAX_DEACTIVATION_RATIO:0.2}
  sync:
    cron: ${MARKET_SYMBOL_SYNC_CRON:0 0 4 * * *}
    zone: ${MARKET_SYMBOL_SYNC_ZONE:Asia/Seoul}

external:
  twelve-data:
    enabled: ${TWELVE_DATA_ENABLED:false}
    base-url: ${TWELVE_DATA_BASE_URL:https://api.twelvedata.com}
    api-key: ${TWELVE_DATA_API_KEY:}
    connect-timeout: PT2S
    read-timeout: PT4S
  observability:
    ai-base-url: ${AI_SERVICE_BASE_URL:}
    ai-api-key: ${AI_SERVICE_API_KEY:}
    n8n-retrain-url: ${N8N_RETRAIN_URL:}
    n8n-api-key: ${N8N_API_KEY:}
    connect-timeout: ${OBSERVABILITY_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${OBSERVABILITY_READ_TIMEOUT:PT10S}
